name: Python PR Validation

# Run the test suite for a new or changed PR only.
# Deliberately no push-to-main trigger: merging an already validated PR must not
# spend another Windows runner or repeat the same test suite.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "run_engine.py"
      - "run_ui.py"
      - "config/**"
      - "legacy/**"
      - "DEPLOY.md"
      - "Deploy_Update.bat"

permissions:
  contents: read

# A newer commit on the same PR supersedes an in-progress run.
# The merge/close event is intentionally not subscribed to.
concurrency:
  group: python-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-python:
    name: Windows / Python 3.14.7
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-documents.txt
            requirements-dev.txt

      - name: Report interpreter
        run: python --version

      - name: Install dependencies once
        run: python -m pip install -r requirements.txt -r requirements-documents.txt -r requirements-dev.txt

      - name: Run test suite once
        run: python -m pytest tests -o addopts="" -q -ra -m "not requires_sample"
